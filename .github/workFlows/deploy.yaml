name : Deploy cicd to ec2 for full stack todo/file app

on: 
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FULL_STACK_HOST_IP }}
          username: ${{ secrets.EC2_FULL_STACK_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/shubh/TodoMern
            git pull origin main
            docker compose up -d --build
            
